<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>FinMEI</title>
  <script>
    // Este arquivo existe para quando o projeto é aberto a partir da raiz
    // do repositório: aí as páginas estão em public/. Num deploy que
    // publica a pasta public como raiz do site (é o caso do Netlify, ver
    // netlify.toml), ele nem chega a ser servido.
    //
    // Mesmo assim ele se vira sozinho nos dois casos: tenta a rota limpa
    // (servidores com clean URLs) e, se não existir, o .html (Live Server
    // e afins). Assim não é preciso editar nada ao publicar.
    (function () {
      var candidatos = ['public/login', 'public/login.html', 'login', 'login.html'];

      // Sem fetch (file:// em navegador antigo) fica no padrão local
      if (typeof fetch !== 'function') {
        location.replace('public/login.html');
        return;
      }

      function tentar(i) {
        if (i >= candidatos.length) {
          location.replace('public/login.html');
          return;
        }
        fetch(candidatos[i], { method: 'HEAD' })
          .then(function (r) {
            if (r.ok) location.replace(candidatos[i]);
            else tentar(i + 1);
          })
          .catch(function () { tentar(i + 1); });
      }

      tentar(0);
    })();
  </script>
</head>

<body>
  <noscript>
    <p>Abra <a href="public/login">public/login</a> (projeto local)
      ou <a href="login">login</a> (site publicado).</p>
  </noscript>
</body>

</html>
