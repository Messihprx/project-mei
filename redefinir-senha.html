<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-header">
            <h1>Nova Senha</h1>
            <p>Digite sua nova senha abaixo.</p>
        </div>

        <div class="formulario">
            <form id="formNovaSenha">
                <div class="input-group">
                    <label>Nova Senha</label>
                    <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="input-group">
                    <label>Confirmar Nova Senha</label>
                    <input type="password" id="confirmarNovaSenha" placeholder="Repita a senha" required>
                </div>
                <button type="submit" class="btn-login" id="btnAtualizar">Atualizar Senha</button>
            </form>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
