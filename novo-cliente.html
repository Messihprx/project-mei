<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cliente | FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">MEI</div><span>finMEI</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="vendas.html" class="nav-item"><i data-lucide="shopping-cart"></i> Vendas</a>
            <a href="gastos.html" class="nav-item">
                <i data-lucide="trending-down"></i> Gastos
            </a>
            <a href="clientes.html" class="nav-item"><i data-lucide="users"></i> Clientes</a>
            <a href="devendo.html" class="nav-item"><i data-lucide="alert-circle"></i> Devedores</a>
            <div class="sidebar-divider">ATALHOS</div>
            <a href="novo-cliente.html" class="nav-item active"><i data-lucide="user-plus"></i> Novo Cliente</a>
            <a href="nova-venda.html" class="nav-item"><i data-lucide="plus-circle"></i> Nova Venda</a>
            <hr>
            <button onclick="logout()" class="btn-logout"><i data-lucide="log-out"></i> <span>Sair</span></button>
        </nav>
    </aside>

    <main class="main-content">
        <button id="btnMenuMobile" class="btn-menu-mobile">
            <i data-lucide="menu"></i>
        </button>
        <header class="top-bar">
            <div class="page-header">
                <h3>Cadastrar Novo Cliente</h3>
                <p>Adicione um novo contato à sua base</p>
            </div>
            <a href="clientes.html" class="btn-logout" style="width: auto; padding: 0.5rem 1rem;">Voltar</a>
        </header>

        <section class="content-wrapper">
            <div class="formulario">
                <form id="formNovoCliente">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="nomeCliente" placeholder="Ex: João Silva" required>
                        <div id="erro-nomeCliente" class="erro-campo"></div>
                    </div>
                    <div class="input-group">
                        <label>Telefone / WhatsApp</label>
                        <input type="text" id="telefoneCliente" placeholder="(00) 00000-0000" required>
                        <div id="erro-telefoneCliente" class="erro-campo"></div>
                    </div>
                    <div class="input-group">
                        <label>Observação (Opcional)</label>
                        <textarea id="obsCliente" placeholder="Ex: Cliente prefere contato via e-mail"
                            style="width: 100%; background: var(--fundo-cor); border: 1px solid var(--borda-cor); color: white; border-radius: 0.5rem; padding: 0.75rem; font-family: inherit; resize: vertical; min-height: 100px;"></textarea>
                    </div>
                    <div id="erro-formNovoCliente" class="erro-campo erro-formulario"></div>
                    <button type="submit" class="btn-primary" style="margin-top: 1rem;">Salvar Cliente</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/novo-cliente.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
