<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">MEI</div>
                <span>finMEI</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
            </a>
            <a href="vendas.html" class="nav-item">
                <i data-lucide="shopping-cart"></i> <span>Vendas</span>
            </a>
            <a href="gastos.html" class="nav-item">
                <i data-lucide="trending-down"></i> <span>Gastos</span>
            </a>
            <a href="clientes.html" class="nav-item active">
                <i data-lucide="users"></i> <span>Clientes</span>
            </a>
            <a href="devendo.html" class="nav-item">
                <i data-lucide="alert-circle"></i> <span>Devedores</span>
            </a>

            <div class="sidebar-divider">ATALHOS</div>
            <a href="novo-cliente.html" class="nav-item">
                <i data-lucide="user-plus"></i> <span>Novo Cliente</span>
            </a>
            <a href="nova-venda.html" class="nav-item">
                <i data-lucide="plus-circle"></i> <span>Nova Venda</span>
            </a>

            <button onclick="logout()" class="btn-logout" style="margin-top: auto;">
                <i data-lucide="log-out"></i> <span>Sair</span>
            </button>
        </nav>
    </aside>

    <main class="main-content">
        <button id="btnMenuMobile" class="btn-menu-mobile">
            <i data-lucide="menu"></i>
        </button>
        <header class="top-bar">
            <div class="page-header">
                <h3>Meus Clientes</h3>
                <p>Visualize e gerencie seus contatos</p>
            </div>
            <div class="user-info" style="display: flex; gap: 8px;">
                <button id="btnExportarClientes" class="btn-secondary" style="font-size: 0.82rem;">
                    <i data-lucide="download" style="width: 15px;"></i> <span>Exportar CSV</span>
                </button>
                <a href="novo-cliente.html" class="btn-primary" style="width: auto; padding: 0.55rem 1.1rem; text-decoration: none; font-size: 0.85rem;">
                    <i data-lucide="user-plus" style="width: 15px;"></i> <span>Novo Cliente</span>
                </a>
            </div>
        </header>

        <section class="content-wrapper">
            <div class="card-buscar" style="margin-bottom: 1.5rem;">
                <label for="buscarCliente">Pesquisar por nome</label>
                <input type="text" id="buscarCliente" placeholder="Digite o nome do cliente...">
            </div>

            <div id="listaClientes">
                </div>
        </section>
    </main>

    <div id="modalEditar" class="modal">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="color: var(--cor-primaria); font-size: 1.1rem;">Editar Cliente</h3>
                <button onclick="fecharModal()" style="background:none; border:none; color:var(--texto-secundario); cursor:pointer; font-size: 1.2rem;">
                    &times;
                </button>
            </div>
            
            <form id="formEditarCliente">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Nome do Cliente</label>
                    <input type="text" id="editNome" required>
                    <div id="erro-editNome" class="erro-campo"></div>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="editTelefone">
                    <div id="erro-editTelefone" class="erro-campo"></div>
                </div>
                <div class="form-group">
                    <label>Observação</label>
                    <textarea id="editObs" rows="3" style="width: 100%; background: var(--fundo-cor); border: 1px solid var(--borda-cor); color: white; border-radius: var(--radius-sm); padding: 0.75rem; margin-top: 0.4rem; font-family: inherit; resize: vertical;"></textarea>
                </div>
                <div id="erro-formEditarCliente" class="erro-campo erro-formulario"></div>
                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Salvar Alterações</button>
                    <button type="button" onclick="fecharModal()" class="btn-secondary" style="flex: 1;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/clientes.js"></script>
    <script>
        // Inicializa ícones do Lucide
        lucide.createIcons();
    </script>

</body>
</html>
