<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme seu e-mail - FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <meta name="theme-color" content="#0b1120">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
        // PWA: deixa o app instalável na tela inicial do celular e
        // guarda CSS/JS em cache para abrir rápido na segunda visita.
        // Dado financeiro nunca é cacheado (ver public/sw.js).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body class="login-page">
    <!-- Branding Panel -->
    <div class="login-branding">
        <div class="brand-content">
            <div class="brand-logo">MEI</div>
            <h2 class="brand-title">Quase lá!</h2>
            <p class="brand-subtitle">Confirme seu e-mail para ativar sua conta e começar a usar.</p>
        </div>
    </div>

    <!-- Confirmar Email -->
    <div class="login-form-panel">
        <div class="login-wrapper confirmar-email-wrapper">
            <div class="login-header">
                <div class="brand-icon-small">MEI</div>
                <h1>Confirme seu e-mail</h1>
            </div>

            <div class="icone-email-pulsante">✉️</div>

            <p style="color: var(--texto-secundario); margin: 0 0 1rem; font-size: 0.9rem; text-align: center;">
                Enviamos um link de confirmação para o seu e-mail.<br>
                Clique no link recebido para ativar sua conta.
            </p>

            <div class="spinner-confirmacao"></div>
            <p id="statusTexto" style="color: var(--texto-secundario); font-size: 0.85rem; margin-top: 1rem; text-align: center;">
                Aguardando confirmação...
            </p>

            <button type="button" class="btn-login" onclick="verificarConfirmacao()" style="margin-top: 1rem;">Já confirmei meu e-mail</button>

            <p class="cadastro-link">
                Não recebeu? <a href="cadastro.html">Tente novamente</a> · <a href="login.html">Voltar para o login</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/auth.js';

        async function verificarConfirmacao() {
            const statusTexto = document.getElementById('statusTexto');
            const { data: { session } } = await supabase.auth.getSession();

            if (session) {
                statusTexto.textContent = 'E-mail confirmado! Entrando...';
                statusTexto.style.color = 'var(--cor-sucesso)';
                setTimeout(() => { window.location.href = "index.html"; }, 800);
                return true;
            }

            const email = localStorage.getItem('emailConfirmacao');
            if (email) {
                try {
                    const { data: confirmado } = await supabase.rpc('verificar_email_confirmado', { p_email: email });
                    if (confirmado) {
                        statusTexto.textContent = 'E-mail confirmado! Entrando...';
                        statusTexto.style.color = 'var(--cor-sucesso)';
                        setTimeout(() => { window.location.href = "login.html?confirmado=1"; }, 1200);
                        return true;
                    }
                } catch (err) {
                    console.error("Erro ao verificar confirmação:", err);
                }
            }
            return false;
        }
        window.verificarConfirmacao = verificarConfirmacao;

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && window.location.pathname.includes("confirmar-email")) {
                verificarConfirmacao();
            }
        });

        // Polling com intervalo crescente.
        //
        // Era fixo em 3s, o que dá 1200 consultas por hora só de uma
        // aba aberta — desperdício puro no plano gratuito do Supabase,
        // e o suficiente para estourar o limite de taxa da própria
        // função. Quem acabou de pedir o e-mail confirma nos primeiros
        // segundos; depois disso, checar de 20 em 20s basta.
        let tentativas = 0;

        function proximoIntervalo() {
            if (tentativas < 10) return 3000;    // primeiros 30s
            if (tentativas < 20) return 10000;   // até ~2min
            return 20000;                        // daí em diante
        }

        function agendarVerificacao() {
            setTimeout(async () => {
                tentativas++;
                await verificarConfirmacao();
                agendarVerificacao();
            }, proximoIntervalo());
        }

        agendarVerificacao();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
