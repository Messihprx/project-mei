<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinMei · Administração</title>
  <link rel="icon" href="../icon_mei.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>

  <!-- Painel administrativo -->
  <div class="app" id="app">

    <aside class="sidebar" id="sidebar">

      <!-- Logo -->
      <div class="brand">
        <div class="box">ADM</div>
        <div>
          <div class="brand-name">fin<span>Mei</span></div>
          <div class="brand-tag">Administração</div>
        </div>
      </div>

      <!-- Menu -->
      <nav class="nav" id="nav">

        <div class="nav-group">Geral</div>

        <a class="nav-item active" data-page="dashboard">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13l9-9 9 9M5 11v9h5v-5h4v5h5v-9"/>
          </svg>
          Dashboard
        </a>

        <a class="nav-item" data-page="usuarios">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87M16 3.13a4 4 0 010 7.75M12 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          Usuários
        </a>

        <a class="nav-item" data-page="assinaturas">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Assinaturas
        </a>

        <a class="nav-item" data-page="pagamentos">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z"/>
          </svg>
          Pagamentos
        </a>

        <div class="nav-group">Configurações</div>

        <a class="nav-item" data-page="gateway">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0-1 .9-1.5 1.6-2.3a3 3 0 10-4.3 4.3C10.9 13.8 11 14 11 15m1-4a1 1 0 100-2 1 1 0 000 2zm-1 7h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Config. de pagamento
        </a>

        <a class="nav-item" data-page="iaconfig">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
          </svg>
          IA Config
        </a>

      </nav>

      <!-- Ações -->
      <div class="sidebar-foot">
        <a href="../index.html" class="btn btn-secondary btn-sm" style="width:100%;text-decoration:none">
          ← Voltar ao site
        </a>
        <button class="btn btn-danger btn-sm" style="width:100%;margin-top:8px" onclick="logout()">
          Sair da conta
        </button>
      </div>

    </aside>

    <div class="main">

      <!-- Cabeçalho -->
      <header class="topbar">
        <div>
          <div class="topbar-title" id="pageTitle">Dashboard</div>
          <div class="topbar-sub" id="pageSub">Visão geral do sistema</div>
        </div>

        <div class="topbar-right">
          <div class="user-chip">
            <span class="u" id="adminInitial">A</span>
            <span id="adminName">Admin</span>
          </div>
        </div>
      </header>

      <!-- Conteúdo -->
      <main class="content" id="content"></main>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle">Título</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Mensagens -->
  <div id="toast"></div>

  <script type="module" src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
