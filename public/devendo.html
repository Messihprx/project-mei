<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/auth-guard.js"></script>
    <title>Devedores | FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <meta name="theme-color" content="#080c16">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
        // PWA: deixa o app instalável na tela inicial do celular e
        // guarda CSS/JS em cache para abrir rápido na segunda visita.
        // Dado financeiro nunca é cacheado (ver public/sw.js).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>

<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">MEI</div>
                <span>finMEI</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="./" class="nav-item">
                <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
            </a>
            <a href="vendas" class="nav-item">
                <i data-lucide="shopping-cart"></i> <span>Vendas</span>
            </a>
            <a href="gastos" class="nav-item">
                <i data-lucide="trending-down"></i> <span>Gastos</span>
            </a>
            <a href="contas" class="nav-item">
                <i data-lucide="wallet"></i> <span>Contas</span>
            </a>
            <a href="clientes" class="nav-item">
                <i data-lucide="users"></i> <span>Clientes</span>
            </a>
            <a href="devendo" class="nav-item active">
                <i data-lucide="alert-circle"></i> <span>Devedores</span>
            </a>
            <a href="produtos" class="nav-item">
                <i data-lucide="package"></i> <span>Produtos</span>
            </a>

            <div class="sidebar-divider">ASSISTENTE</div>
            <a href="ia" class="nav-item">
                <i data-lucide="sparkles"></i> <span>FinMEI IA</span>
            </a>

            <div class="sidebar-divider">CONTA</div>
            <a href="perfil" class="nav-item">
                <i data-lucide="user-round"></i> <span>Meu perfil</span>
            </a>
            <a href="planos" class="nav-item">
                <i data-lucide="star"></i> <span>Ver Planos</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <button id="btnMenuMobile" class="btn-menu-mobile">
            <i data-lucide="menu"></i>
        </button>
        <header class="top-bar">
            <div class="page-header">
                <h3>Clientes em Aberto</h3>
                <p>Lista de vendas com pagamento pendente</p>
            </div>

            <div class="user-info devedores-header-pc" style="display: flex; gap: 1rem; align-items: center;">
                <div class="filtro-mes-devendo">
                    <label for="filtroMesDevendo" style="font-size: 0.72rem; color: var(--texto-faint); margin-bottom: 4px;">Filtrar mês</label>
                    <input type="month" id="filtroMesDevendo" class="input-mes" style="margin-top: 0; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                </div>
                <div class="contador-pendentes">
                    Pendentes: <span id="qtdPendentes">0</span>
                </div>
            </div>
        </header>

        <section class="content-wrapper">
            <div class="resumo-pendentes resumo-pendentes-mobile">
                <span style="color: var(--texto-secundario); font-size: 0.9rem;">Total a Receber:</span>
                <h2 id="totalPendentes" class="total-pendentes" style="font-size: 2rem;">R$ 0,00</h2>
            </div>

            <div id="listaDevedores" class="lista-devedores-mobile">
                </div>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/ai-fab.js"></script>
    <script type="module" src="js/devendo.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
