<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-header">
            <h1>Recuperar Senha</h1>
            <p>Digite seu e-mail para receber um link de redefinição.</p>
        </div>

        <div class="formulario">
            <form id="formRecuperar">
                <div class="input-group">
                    <label>E-mail cadastrado</label>
                    <input type="email" id="emailRecuperar" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit" class="btn-login" id="btnRecuperar">Enviar Link</button>
                <p class="cadastro-link">
                    Lembrou a senha? <a href="login.html">Voltar para o login</a>
                </p>
            </form>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
