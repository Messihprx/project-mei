<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">
    <!-- Branding Panel -->
    <div class="login-branding">
        <div class="brand-content">
            <div class="brand-logo">MEI</div>
            <h2 class="brand-title">Esqueceu a senha?</h2>
            <p class="brand-subtitle">Não se preocupe, enviaremos um link para redefinir sua senha.</p>
            <div class="brand-features">
                <div class="brand-feature">
                    <i data-lucide="check-circle"></i>
                    <span>Link seguro por email</span>
                </div>
                <div class="brand-feature">
                    <i data-lucide="check-circle"></i>
                    <span>Redefina em segundos</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Recuperar Form -->
    <div class="login-form-panel">
        <div class="login-wrapper">
            <div class="login-header">
                <div class="brand-icon-small">MEI</div>
                <h1>Recuperar Senha</h1>
                <p>Digite seu e-mail para receber um link de redefinição.</p>
            </div>

            <form id="formRecuperar">
                <div class="input-group">
                    <label>E-mail cadastrado</label>
                    <input type="email" id="emailRecuperar" placeholder="seu@email.com" required>
                </div>
                <button type="submit" class="btn-login" id="btnRecuperar">Enviar Link</button>
                <p class="cadastro-link">
                    Lembrou a senha? <a href="login.html">Voltar para o login</a>
                </p>
            </form>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
