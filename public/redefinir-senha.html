<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - FinMEI fluxo inteligente</title>
    <link rel="icon" href="icon_mei.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <meta name="theme-color" content="#0b1120">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
        // PWA: deixa o app instalável na tela inicial do celular e
        // guarda CSS/JS em cache para abrir rápido na segunda visita.
        // Dado financeiro nunca é cacheado (ver public/sw.js).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body class="login-page">
    <!-- Branding Panel -->
    <div class="login-branding">
        <div class="brand-content">
            <div class="brand-logo">MEI</div>
            <h2 class="brand-title">Nova Senha</h2>
            <p class="brand-subtitle">Escolha uma senha forte e segura para sua conta.</p>
        </div>
    </div>

    <!-- Nova Senha Form -->
    <div class="login-form-panel">
        <div class="login-wrapper">
            <div class="login-header">
                <div class="brand-icon-small">MEI</div>
                <h1>Definir nova senha</h1>
                <p>Digite sua nova senha abaixo.</p>
            </div>

            <form id="formNovaSenha">
                <div class="input-group">
                    <label>Nova Senha</label>
                    <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="input-group">
                    <label>Confirmar Nova Senha</label>
                    <input type="password" id="confirmarNovaSenha" placeholder="Repita a senha" required>
                </div>
                <button type="submit" class="btn-login" id="btnAtualizar">Atualizar Senha</button>
            </form>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
