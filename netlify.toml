  to = "/confirmar-email.html"
  status = 200

[[redirects]]
  from = "/planos"
  to = "/planos.html"
  status = 200

[[redirects]]
  from = "/vendas"
  to = "/vendas.html"
  status = 200

[[redirects]]
  from = "/gastos"
  to = "/gastos.html"
  status = 200

[[redirects]]
