[build]
  publish = "public"

# Rotas sem .html
#
# Os arquivos continuam sendo *.html em disco, mas o site passa a
# responder em /login, /vendas, /planos etc. A regra 200 reescreve a
# URL limpa para o arquivo correspondente sem trocar o endereço no
# navegador. Os links internos já apontam para as rotas limpas.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/cadastro"
  to = "/cadastro.html"
  status = 200

[[redirects]]
  from = "/recuperar"
  to = "/recuperar.html"
  status = 200

[[redirects]]
